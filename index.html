<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Nethphorn.TB</title>
    <meta
      name="description"
      content="An interactive portfolio website simulating a desktop operating system. Explore my projects, skills, and resume in a unique OS-like environment."
    />
    <meta
      name="keywords"
      content="portfolio, web developer, interactive design, os simulation, javascript projects"
    />
    <meta name="author" content="Portfolio Owner" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nethphorn.TB" />
    <meta
      property="og:description"
      content="Explore my projects and skills in this interactive web-based operating system."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/brath/portfolio-os/main/og-image.jpg"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Nethphorn.TB" />
    <meta
      property="twitter:description"
      content="Explore my projects and skills in this interactive web-based operating system."
    />

    <!-- Link to our Custom Styles -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/pixel-theme.css" />
    <link rel="stylesheet" href="css/pixel-theme-fonts.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/svg/logoBlue.svg" />

    <!-- Google Fonts: 'Inter' is a clean, modern font often used in UIs -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome: Library for icons (folders, start menu, etc.) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Three.js Import Map -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- 
      BOOT SCREEN 
      This overlay covers the page initially to simulate an OS booting up.
      It gets removed by JavaScript after a few seconds.
    -->
    <div id="boot-screen">
      <div class="spinner"></div>
      <h2>Loading OS...</h2>
    </div>

    <!-- Video Background -->
    <video id="bg-video" autoplay muted loop playsinline></video>

    <!-- 
      DESKTOP ENVIRONMENT 
      This is the main container for the wallpaper, icons, and open windows.
    -->
    <div id="desktop">
      <!-- 
        Desktop Icons:
        These are generated dynamically by JavaScript (js/desktop.js) based on the 'apps' array.
      -->
      <div class="desktop-icons" id="desktop-icons"></div>

      <!-- Center Text -->
      <div id="center-text">
        <div class="pixel-text" id="welcome-text-en">
          Hi!, I'm Nethphorn Tepbrathna!
        </div>
        <div class="pixel-text" id="welcome-text-jp">
          こんにちは、ネットポアン テップラタンナーです！
        </div>
      </div>

      <!-- 
        Windows Container:
        When you open an app, the HTML for that "window" is injected here.
        We use absolute positioning to move them around.
      -->
      <div id="windows-container"></div>
    </div>

    <!-- 
      TASKBAR
      Fixed at the bottom of the screen. 
    -->
    <div id="taskbar">
      <!-- Start Button (Left) -->
      <div class="start-button" id="start-btn">
        <div class="start-icon"></div>
      </div>

      <!-- Active Apps (Middle) -->
      <div class="taskbar-apps" id="taskbar-apps">
        <!-- App icons appear here when windows are open -->
      </div>

      <!-- System Tray (Right) - Clock, Wifi, Sound -->
      <div class="tray-area">
        <div class="tray-icon" id="volume-btn">
          <i class="fa-solid fa-volume-high" id="volume-icon"></i>
        </div>
        <div class="tray-icon"><i class="fa-solid fa-wifi"></i></div>
        <div class="clock" id="clock">12:00 PM</div>
      </div>
    </div>

    <!-- Main Logic Script (Module) -->
    <script type="module" src="js/main.js"></script>

    <!-- UI Templates -->
    <template id="tpl-window">
      <div class="window-header">
        <div class="window-title"></div>
        <div class="window-controls">
          <button class="control-btn min-btn"></button>
          <button class="control-btn max-btn"></button>
          <button class="control-btn close-btn"></button>
        </div>
      </div>
      <div class="window-content"></div>
      <!-- Resize Handles -->
      <div class="resizer n"></div>
      <div class="resizer e"></div>
      <div class="resizer s"></div>
      <div class="resizer w"></div>
      <div class="resizer ne"></div>
      <div class="resizer se"></div>
      <div class="resizer sw"></div>
      <div class="resizer nw"></div>
    </template>

    <template id="tpl-terminal">
      <div class="term-output"></div>
      <div class="term-input-line">
        <span>$ </span><input type="text" spellcheck="false" autofocus />
      </div>
    </template>

    <template id="tpl-contact">
      <div class="contact-container">
        <h2>Contact Me</h2>
        <div class="contact-links">
          <a href="https://github.com/SterbenIsDed" target="_blank"
            ><i class="fa-brands fa-github"></i
          ></a>
          <a href="https://linkedin.com/in/SterbenIsDed" target="_blank"
            ><i class="fa-brands fa-linkedin"></i
          ></a>
          <a href="mailto:nethphorn.tb@gmail.com"
            ><i class="fa-solid fa-envelope"></i
          ></a>
        </div>
        <p>nethphorn.tb@gmail.com</p>
      </div>
    </template>

    <template id="tpl-project-viewer">
      <div class="project-viewer-container">
        <img class="project-img" src="" alt="Project Preview" />
        <h2 class="project-title"></h2>
        <p class="project-desc"></p>
        <div class="project-actions">
          <a href="" target="_blank" class="action-btn secondary btn-repo">
            <i class="fa-brands fa-github"></i> GitHub Repo
          </a>
          <a href="" target="_blank" class="action-btn primary btn-demo">
            <i class="fa-solid fa-external-link"></i> Open App
          </a>
        </div>
      </div>
    </template>

    <template id="tpl-volume-popup">
      <div class="volume-slider-container">
        <i class="fa-solid fa-volume-high"></i>
        <input type="range" class="volume-slider" min="0" max="1" step="0.01" />
        <i class="fa-solid fa-volume-xmark"></i>
      </div>
    </template>

    <!-- Pixel Icons (Hidden for reuse) -->
    <div style="display: none">
      <svg id="icon-folder" width="40" height="40" viewBox="0 0 24 24">
        <path
          d="M22 6H12L10 4H2V20H22V6Z"
          fill="#F8D775"
          stroke="#000"
          stroke-width="2"
        />
        <path d="M2 6H22V20H2V6Z" fill="#F8D775" stroke="#000" stroke-width="2" />
        <path d="M12 6L10 4H2V6H12Z" fill="#FFE59A" />
        <rect x="3" y="7" width="18" height="1" fill="#FFE59A" />
        <rect x="2" y="6" width="1" height="14" fill="#000" />
        <rect x="21" y="6" width="1" height="14" fill="#000" />
        <rect x="2" y="20" width="20" height="1" fill="#000" />
      </svg>

      <svg id="icon-project" width="24" height="24" viewBox="0 0 24 24">
        <path d="M2 4H22V16H2V4Z" fill="#58a6ff" stroke="black" />
        <path d="M4 16V18H20V16" fill="black" />
        <rect x="8" y="18" width="8" height="2" fill="black" />
      </svg>

      <svg id="icon-pdf" width="24" height="24" viewBox="0 0 24 24">
        <path d="M4 2H20V22H4V2Z" fill="#ff5555" stroke="black" />
        <path d="M8 6H16" stroke="white" stroke-width="2" />
        <path d="M8 10H16" stroke="white" stroke-width="2" />
        <path d="M8 14H16" stroke="white" stroke-width="2" />
      </svg>

      <svg id="icon-image" width="24" height="24" viewBox="0 0 24 24">
        <path d="M2 2H22V22H2V2Z" fill="#ffffff" stroke="black" />
        <circle cx="8" cy="8" r="3" fill="#ffcc00" />
        <path
          d="M2 16L8 10L14 16L18 12L22 16V22H2V16Z"
          fill="#44aa44"
        />
      </svg>
    </div>
  </body>
</html>
